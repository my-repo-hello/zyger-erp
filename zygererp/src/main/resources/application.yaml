spring:
  application:
    name: zygererp
  profiles:
    active: dev
  cache:
    type: com.github.benmanes.caffeine.cache.CaffeineCacheManager
  datasource:
    url: jdbc:postgresql://localhost:5432/zyger_erp
    username: ${DB_USERNAME:zyger}
    password: ${DB_PASSWORD:zyger123}
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-start: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  lifecycle:
    timeout-per-shutdown-phase: 60s
server:
  port: ${SERVER_PORT:9090}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/css,text/javascript
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-a-256-bit-random-string}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  security:
    password-min-length: ${PASSWORD_MIN_LENGTH:8}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lockout-minutes: ${LOCKOUT_MINUTES:15}
