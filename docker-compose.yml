version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zyger_erp
      POSTGRES_USER: zyger
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zyger123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyger -d zyger_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "9090:9090"
    environment:
      DB_USERNAME: zyger
      DB_PASSWORD: ${DB_PASSWORD:-zyger123}
      DB_URL: jdbc:postgresql://db:5432/zyger_erp
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-256-bit-random-string}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
