services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zyger_erp
      POSTGRES_USER: zyger
      POSTGRES_PASSWORD: zyger123
    # port not exposed externally - internal Docker networking only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyger -d zyger_erp"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DB_USERNAME: zyger
      DB_PASSWORD: zyger123
      DB_URL: jdbc:postgresql://db:5432/zyger_erp
      CORS_ORIGINS: "http://localhost,http://localhost:80"
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "9090:9090"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
